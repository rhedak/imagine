[project]
name = "imagine"
version = "0.1.0"
description = "Thin, provider-agnostic clients for AI image generation (Gemini, xAI Grok Imagine, OpenAI), tuned for reference-guided generation."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "rhedak", email = "rhedak@proton.me" },
]
keywords = ["image-generation", "gemini", "grok", "openai", "genai", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
gemini = ["google-genai>=1.0.0"]
openai = ["openai>=1.0.0"]
all = ["google-genai>=1.0.0", "openai>=1.0.0"]

[project.urls]
Repository = "https://github.com/rhedak/imagine"
Issues = "https://github.com/rhedak/imagine/issues"

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["imagine"]
